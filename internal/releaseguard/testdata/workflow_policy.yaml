- name: release_tag_exact_checkout
  kind: literal
  file: .github/workflows/release.yml
  contains: "ref: ${{ github.sha }}"
- name: release_tag_gate
  kind: release_check
  file: .github/workflows/release.yml
  job: guard
  step: Verify tag commit and run release quality gate
  want: true
- name: normal_pr_quality_gate
  kind: release_check
  file: .github/workflows/tests.yml
  job: test
  step: Run module quality gate
  want: true
- name: tag_commit_identity
  kind: literal
  file: .github/workflows/release.yml
  contains: 'test "$(git rev-parse HEAD)" = "$GITHUB_SHA"'
- name: tag_ref_identity
  kind: literal
  file: .github/workflows/release.yml
  contains: 'test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"'
- name: echo_only_release_check
  kind: release_check
  job: gate
  step: Echo only
  workflow: |
    name: inert echo gate
    jobs:
      gate:
        runs-on: ubuntu-latest
        steps:
          - name: Echo only
            run: echo make release-check
  want: false
- name: comment_only_release_check
  kind: release_check
  job: gate
  step: Comment only
  workflow: |
    name: inert comment gate
    jobs:
      gate:
        runs-on: ubuntu-latest
        steps:
          - name: Comment only
            run: |
              # make release-check
  want: false
- name: missing_release_check
  kind: release_check
  job: gate
  step: Missing command
  workflow: |
    name: missing gate
    jobs:
      gate:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout only
            uses: actions/checkout@v5
  want: false
- name: release_guard_history_checkout
  kind: history_checkout
  file: .github/workflows/release.yml
  job: guard
  step: Check out the repository
  fetch_tags: true
  want: true
- name: release_verify_history_checkout
  kind: history_checkout
  file: .github/workflows/release.yml
  job: verify
  step: Check out the repository (full history and tags)
  fetch_tags: true
  want: true
- name: tests_changes_history_checkout
  kind: history_checkout
  file: .github/workflows/tests.yml
  job: changes
  step: Checkout repository
  fetch_tags: true
  want: true
- name: title_guard_history_checkout
  kind: history_checkout
  file: .github/workflows/title-guard.yml
  job: title-guard
  step: Check out the repository (full history and tags, no blobs)
  fetch_tags: true
  want: true
- name: release_batch_plan_history_checkout
  kind: history_checkout
  file: .github/workflows/release-batch.yml
  job: plan
  step: Check out the repository (full history and tags)
  fetch_tags: true
  want: true
- name: release_batch_verify_history_checkout
  kind: history_checkout
  file: .github/workflows/release-batch.yml
  job: verify
  step: Check out the repository (full history and tags)
  fetch_tags: true
  want: true
- name: release_batch_release_history_checkout
  kind: history_checkout
  file: .github/workflows/release-batch.yml
  job: release
  step: Check out the repository
  want: true
- name: cut_release_prepare_history_checkout
  kind: history_checkout
  file: .github/workflows/cut-release.yml
  job: prepare
  step: Check out the repository
  want: true
- name: cut_release_cut_history_checkout
  kind: history_checkout
  file: .github/workflows/cut-release.yml
  job: cut
  step: Check out the repository
  want: true
- name: shallow_history_checkout
  kind: history_checkout
  job: verify
  step: Check out the repository (full history and tags)
  fetch_tags: true
  workflow: |
    name: shallow checkout
    jobs:
      verify:
        runs-on: ubuntu-latest
        steps:
          - name: Check out the repository (full history and tags)
            uses: actions/checkout@v5
            with:
              fetch-depth: 1
              fetch-tags: true
  want: false
- name: misplaced_history_checkout
  kind: history_checkout
  job: verify
  step: Check out the repository (full history and tags)
  fetch_tags: true
  workflow: |
    name: misplaced checkout controls
    jobs:
      verify:
        runs-on: ubuntu-latest
        steps:
          - name: Check out the repository (full history and tags)
            uses: actions/checkout@v5
            with:
              persist-credentials: false
          - name: Check out the release-intent tool
            uses: actions/checkout@v5
            with:
              repository: peasant-labs/infra
              fetch-depth: 0
              fetch-tags: true
  want: false
- name: missing_tags_history_checkout
  kind: history_checkout
  job: verify
  step: Check out the repository (full history and tags)
  fetch_tags: true
  workflow: |
    name: missing tags checkout
    jobs:
      verify:
        runs-on: ubuntu-latest
        steps:
          - name: Check out the repository (full history and tags)
            uses: actions/checkout@v5
            with:
              fetch-depth: 0
  want: false
- name: wrong_repository_history_checkout
  kind: history_checkout
