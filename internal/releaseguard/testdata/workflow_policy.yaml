- name: release_tag_exact_checkout
  kind: literal
  file: .github/workflows/release.yml
  contains: "ref: ${{ github.sha }}"
- name: release_tag_gate
  kind: release_check
  file: .github/workflows/release.yml
  job: guard
  step: Verify tag commit and run release quality gate
  want: true
- name: normal_pr_quality_gate
  kind: release_check
  file: .github/workflows/tests.yml
  job: test
  step: Run module quality gate
  want: true
- name: tag_commit_identity
  kind: literal
  file: .github/workflows/release.yml
  contains: 'test "$(git rev-parse HEAD)" = "$GITHUB_SHA"'
- name: tag_ref_identity
  kind: literal
  file: .github/workflows/release.yml
  contains: 'test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"'
- name: echo_only_release_check
  kind: release_check
  job: gate
  step: Echo only
  workflow: |
    name: inert echo gate
    jobs:
      gate:
        runs-on: ubuntu-latest
        steps:
          - name: Echo only
            run: echo make release-check
  want: false
- name: comment_only_release_check
  kind: release_check
  job: gate
  step: Comment only
  workflow: |
    name: inert comment gate
    jobs:
      gate:
        runs-on: ubuntu-latest
        steps:
          - name: Comment only
            run: |
              # make release-check
  want: false
- name: missing_release_check
  kind: release_check
  job: gate
  step: Missing command
  workflow: |
    name: missing gate
    jobs:
      gate:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout only
            uses: actions/checkout@v5
  want: false
- name: private_ast_grep_release
  kind: literal
  file: .github/workflows/release.yml
  contains: |
    prefix="$RUNNER_TEMP/ast-grep"
              npm install --prefix "$prefix" --no-save --no-package-lock @ast-grep/cli@0.51.2
              echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
              "$prefix/node_modules/.bin/ast-grep" --version
- name: private_ast_grep_tests
  kind: literal
  file: .github/workflows/tests.yml
  contains: |
    prefix="$RUNNER_TEMP/ast-grep"
              npm install --prefix "$prefix" --no-save --no-package-lock @ast-grep/cli@0.51.2
              echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
              "$prefix/node_modules/.bin/ast-grep" --version
- name: no_global_npm_installs
  kind: no_global_npm
  contains: '(?m)\bnpm\s+(install|i)\b[^\n]*(--global\b|(?:^|\s)-g(?:\s|$))'
