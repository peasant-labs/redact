name: Tests

# Quality gate for the redact module.
# Runs on PRs and pushes to main. Jobs run on the organization's self-hosted
# runner pool when available, on ubuntu-latest otherwise; both
# environments default CGO_ENABLED=1, which the race detector and the
# tree-sitter anonymizer require. The routing job is the shared reusable
# workflow maintained in peasant-labs/infra.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  determine-runner:
    uses: peasant-labs/infra/.github/workflows/runner-router.yml@71e687cef7eede9a63659be98ce9adac3c563398
    with:
      fallback: '["ubuntu-latest"]'
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  test:
    name: test
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          # Our pool keeps GOCACHE/GOMODCACHE on the host, so the GitHub cache
          # there only re-downloads that host's own snapshot, and a key miss tars
          # the whole shared cache for an upload over the 10 GB limit.
          cache: ${{ needs.determine-runner.outputs.pool != 'true' }}

      - name: Run module quality gate
        run: make release-check

      - name: Engine parity and relative allocation budgets
        run: make perf PERF_ARGS=--ci

  lint:
    name: lint
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          # Our pool keeps GOCACHE/GOMODCACHE on the host, so the GitHub cache
          # there only re-downloads that host's own snapshot, and a key miss tars
          # the whole shared cache for an upload over the 10 GB limit.
          cache: ${{ needs.determine-runner.outputs.pool != 'true' }}

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::Files not formatted:"
            gofmt -l .
            exit 1
          fi
