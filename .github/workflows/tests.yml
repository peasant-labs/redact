name: Tests

# Quality gate for the redact module.
# Runs on PRs and pushes to main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  determine-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Pick a runner
        id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -euo pipefail
          if ! online=$(gh api /orgs/peasant-labs/actions/runners --paginate \
              --jq '.runners[] | select(.status == "online") | select(any(.labels[]; .name == "nixos")) | .name' 2>/dev/null | wc -l); then
            echo "::warning::runner availability query failed; using the fallback"
            online=0
          fi
          echo "online runners: ${online}"
          if [ "${online}" -gt 0 ]; then
            echo 'runner=["self-hosted","nixos"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi
      - name: Report chosen runner
        env:
          CHOSEN: ${{ steps.pick.outputs.runner }}
        run: 'echo "chosen: $CHOSEN"'

  test:
    name: test
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 15
    # The race detector and the tree-sitter anonymizer both require cgo.
    # The pool job environment leaves CGO_ENABLED off, so pin it on for
    # this job to keep race and tree-sitter coverage.
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run module quality gate
        run: make release-check

  lint:
    name: lint
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::Files not formatted:"
            gofmt -l .
            exit 1
          fi
