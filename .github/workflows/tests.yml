name: Tests

# Quality gate for the redact module.
# Runs on PRs and pushes to main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  determine-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.use-runner }}
    steps:
      - name: Pick a runner
        id: pick
        uses: mikehardy/runner-fallback-action@dc7732f9e532c451b2527b288ba8d58fd4b0a4ca # v1.1.0
        with:
          organization: peasant-labs
          primary-runner: "self-hosted,nixos"
          fallback-runner: "ubuntu-latest"
          fallback-on-error: true
          github-token: ${{ secrets.RUNNER_STATUS_TOKEN }}
      - name: Report chosen runner
        run: 'echo "chosen: ${{ steps.pick.outputs.use-runner }}"'

  test:
    name: test
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run module quality gate
        run: make release-check

  lint:
    name: lint
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::Files not formatted:"
            gofmt -l .
            exit 1
          fi
