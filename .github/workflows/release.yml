name: Release

# Tag-triggered release pipeline for the redact module.
# Creates a GitHub Release when a version tag is pushed.
#
# Simplified vs schema: no OpenAPI assets, no contract gates, no Nix.
# Just create the release with release notes.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify tag commit and run release quality gate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          make release-check

      - name: Classify release and verify final-release ancestry
        id: guard
        run: |
          read -r KIND BASE <<EOF
          $(go run ./cmd/releaseguard tag "$TAG")
          EOF
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          if [ "$KIND" = final ]; then
            mapfile -t RC_TAGS < <(git tag --merged "$GITHUB_SHA" --list "${BASE}-rc*" --sort=-v:refname)
            RC_TAG="${RC_TAGS[0]:-}"
            if [ -z "$RC_TAG" ]; then
              echo "::error::Final release $TAG requires a same-version release-candidate ancestor."
              exit 1
            fi
            go run ./cmd/releaseguard tag "$RC_TAG" >/dev/null
            RC_SHA=$(git rev-list -n 1 "$RC_TAG")
            gh run list --workflow Release --commit "$RC_SHA" --status success --limit 1 --json databaseId --jq 'length == 1' | grep -qx true || {
              echo "::error::Release candidate $RC_TAG has no successful Release workflow evidence."
              exit 1
            }
          fi

      - name: Create the GitHub Release
        run: |
          set -euo pipefail

          prerelease_flag=""
          if [ "${{ steps.guard.outputs.kind }}" = prerelease ]; then
            prerelease_flag="--prerelease"
            echo "Creating prerelease for ${TAG}"
          else
            echo "Creating full release for ${TAG}"
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            $prerelease_flag

          echo "::notice::published GitHub Release ${TAG}"
