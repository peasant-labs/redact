name: Release

# Tag-triggered release pipeline for the redact module.
# Creates a GitHub Release when a version tag is pushed.
#
# Simplified vs schema: no OpenAPI assets, no contract gates, no Nix.
# Just create the release with release notes.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify tag commit and run release quality gate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          make release-check

      - name: Classify release (rc vs final)
        id: guard
        # Finals no longer require a prior rc (matching schema and peasant). The
        # rc-vs-final classification is kept because the next step uses it to set
        # --prerelease for -rcN tags; rc remains available, just not mandatory.
        run: |
          read -r KIND _ <<EOF
          $(go run ./cmd/releaseguard tag "$TAG")
          EOF
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "Release kind: $KIND"

      - name: Create the GitHub Release
        run: |
          set -euo pipefail

          prerelease_flag=""
          if [ "${{ steps.guard.outputs.kind }}" = prerelease ]; then
            prerelease_flag="--prerelease"
            echo "Creating prerelease for ${TAG}"
          else
            echo "Creating full release for ${TAG}"
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            $prerelease_flag

          echo "::notice::published GitHub Release ${TAG}"
