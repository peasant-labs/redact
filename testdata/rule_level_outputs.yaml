  # This row records what generic_api_key does to the header today, so that a
  # change to it is seen. The output is not the wanted one: the rule matches
  # from "api-key" and its placeholder replaces part of the header name. The
  # rows around it show the output the newer rules give ("name: <SECRET>").
  - name: x_api_key_header
    ruleId: generic_api_key
    category: secrets
    input: "x-api-key: canaryHdrKey0123456789abcdef"
    expectations:
      minimal:
        active: true
        output: "x-<API_KEY>"
      standard:
        active: true
        output: "x-<API_KEY>"
      maximum:
        active: true
        output: "x-<API_KEY>"

  - name: x_api_key_header_outside_generic_shape
    ruleId: key_name_secret
    category: secrets
    input: "x-api-key: canaryHdr.Key+0123456789/abc="
    expectations:
      minimal:
        active: true
        output: "x-api-key: <SECRET>"
      standard:
        active: true
        output: "x-api-key: <SECRET>"
      maximum:
        active: true
        output: "x-api-key: <SECRET>"

