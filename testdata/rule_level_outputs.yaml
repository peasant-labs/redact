cases:
  - name: git_remote_https
    ruleId: git_remote_https
    category: project
    minimumLevel: maximum
    input: "remote: https://github.com/myorg/myrepo.git"
    expectations:
      minimal:
        active: false
        output: "remote: https://github.com/myorg/myrepo.git"
      standard:
        active: false
        output: "remote: https://github.com/myorg/myrepo.git"
      maximum:
        active: true
        output: "remote: <PROJECT_URL>"

  - name: git_remote_ssh
    ruleId: git_remote_ssh
    category: project
    minimumLevel: maximum
    input: "remote: git@github.com:myorg/myrepo.git"
    panicFallbackOutput: "remote: <PROJECT_URL>"
    expectations:
      minimal:
        active: false
        output: "remote: git@github.com:myorg/myrepo.git"
      standard:
        active: false
        output: "remote: git@github.com:myorg/myrepo.git"
      maximum:
        active: true
        output: "remote: <PROJECT_URL>"

  - name: go_import_path
    ruleId: go_import_path
    category: project
    input: 'import "github.com/myorg/myrepo"'
    expectations:
      minimal:
        active: false
        output: 'import "github.com/myorg/myrepo"'
      standard:
        active: true
        output: 'import "<GO_IMPORT>"'
      maximum:
        active: true
        output: 'import "<GO_IMPORT>"'

  - name: go_module_path
    ruleId: go_module_path
    category: project
    input: "module github.com/myorg/myrepo"
    expectations:
      minimal:
        active: false
        output: "module github.com/myorg/myrepo"
      standard:
        active: true
        output: "module <GO_MODULE>"
      maximum:
        active: true
        output: "module <GO_MODULE>"

  - name: npm_repo_url
    ruleId: npm_repo_url
    category: project
    input: '"repository": "https://github.com/myorg/myrepo"'
    expectations:
      minimal:
        active: false
        output: '"repository": "https://github.com/myorg/myrepo"'
      standard:
        active: true
        output: '<NPM_REPO>"'
      maximum:
        active: true
        output: '<NPM_REPO>"'

  - name: docker_image_ref
    ruleId: docker_image_ref
    category: project
    input: "FROM myorg/myimage:latest"
    expectations:
      minimal:
        active: false
        output: "FROM myorg/myimage:latest"
      standard:
        active: true
        output: "<DOCKER_IMAGE>"
      maximum:
        active: true
        output: "<DOCKER_IMAGE>"

  - name: ghcr_image_ref
    ruleId: ghcr_image_ref
    category: project
    input: "ghcr.io/myorg/myimage:latest"
    expectations:
      minimal:
        active: false
        output: "ghcr.io/myorg/myimage:latest"
      standard:
        active: true
        output: "<GHCR_IMAGE>"
      maximum:
        active: true
        output: "<GHCR_IMAGE>"

  - name: git_branch_output
    ruleId: git_branch_output
    category: project
    minimumLevel: maximum
    input: "* feature/my-feature"
    expectations:
      minimal:
        active: false
        output: "* feature/my-feature"
      standard:
        active: false
        output: "* feature/my-feature"
      maximum:
        active: true
        output: "<BRANCH>"

  - name: gitlab_ci_project
    ruleId: gitlab_ci_project
    category: project
    input: "CI_PROJECT_NAME=myproject"
    expectations:
      minimal:
        active: false
        output: "CI_PROJECT_NAME=myproject"
      standard:
        active: true
        output: "<CI_PROJECT>"
      maximum:
        active: true
        output: "<CI_PROJECT>"

  - name: github_actions_repo
    ruleId: github_actions_repo
    category: project
    input: "GITHUB_REPOSITORY=myorg/myrepo"
    expectations:
      minimal:
        active: false
        output: "GITHUB_REPOSITORY=myorg/myrepo"
      standard:
        active: true
        output: "<GH_REPO>"
      maximum:
        active: true
        output: "<GH_REPO>"

  - name: ordinary_email
    ruleId: email
    control: ordinary_email
    category: pii
    input: "git@example.com"
    expectations:
      minimal:
        active: false
        output: "git@example.com"
      standard:
        active: true
        output: "<EMAIL>"
      maximum:
        active: true
        output: "<EMAIL>"

  - name: git_email_without_remote_path
    ruleId: email
    control: git_email_without_remote_path
    category: pii
    input: "git@github.com"
    expectations:
      minimal:
        active: false
        output: "git@github.com"
      standard:
        active: true
        output: "<EMAIL>"
      maximum:
        active: true
        output: "<EMAIL>"

  - name: git_email_followed_by_prose
    ruleId: email
    control: git_email_followed_by_prose
    category: pii
    input: "git@github.com: note"
    expectations:
      minimal:
        active: false
        output: "git@github.com: note"
      standard:
        active: true
        output: "<EMAIL>: note"
      maximum:
        active: true
        output: "<EMAIL>: note"

  - name: unsupported_scp_remote_email_prefix
    ruleId: email
    control: unsupported_scp_remote_email_prefix
    category: pii
    input: "git@git.internal.corp:myorg/myrepo.git"
    expectations:
      minimal:
        active: false
        output: "git@git.internal.corp:myorg/myrepo.git"
      standard:
        active: true
        output: "<EMAIL>:myorg/myrepo.git"
      maximum:
        active: true
        output: "<EMAIL>:myorg/myrepo.git"

  # Secret rules that keep the text around the value. Each row pins the exact
  # output, because these rules replace one part of their match.
  - name: key_name_env_assignment
    ruleId: key_name_secret
    category: secrets
    input: "INTERNAL_API_TOKEN=canary-9f8e7d6c5b4a3928"
    expectations:
      minimal:
        active: true
        output: "INTERNAL_API_TOKEN=<SECRET>"
      standard:
        active: true
        output: "INTERNAL_API_TOKEN=<SECRET>"
      maximum:
        active: true
        output: "INTERNAL_API_TOKEN=<SECRET>"

  - name: key_name_json_text
    ruleId: key_name_secret
    category: secrets
    input: '{"db_password": "canaryJsonPw0rd!2026"}'
    expectations:
      minimal:
        active: true
        output: '{"db_password": "<SECRET>"}'
      standard:
        active: true
        output: '{"db_password": "<SECRET>"}'
      maximum:
        active: true
        output: '{"db_password": "<SECRET>"}'

  - name: key_name_escaped_json_text
    ruleId: key_name_secret
    category: secrets
    input: '{\"session_token\": \"canaryNested0123456789\"}'
    expectations:
      minimal:
        active: true
        output: '{\"session_token\": \"<SECRET>\"}'
      standard:
        active: true
        output: '{\"session_token\": \"<SECRET>\"}'
      maximum:
        active: true
        output: '{\"session_token\": \"<SECRET>\"}'

  - name: key_name_command_flag
    ruleId: key_name_secret
    category: secrets
    input: "deploy --db-password canaryFlagPw0rd!77 --verbose"
    expectations:
      minimal:
        active: true
        output: "deploy --db-password <SECRET> --verbose"
      standard:
        active: true
        output: "deploy --db-password <SECRET> --verbose"
      maximum:
        active: true
        output: "deploy --db-password <SECRET> --verbose"

  - name: key_name_trailing_punctuation_kept
    ruleId: key_name_secret
    category: secrets
    input: "connect(user=jane, password=canaryCallPw0rd!88);"
    expectations:
      minimal:
        active: true
        output: "connect(user=jane, password=<SECRET>);"
      standard:
        active: true
        output: "connect(user=jane, password=<SECRET>);"
      maximum:
        active: true
        output: "connect(user=jane, password=<SECRET>);"

  - name: url_query_token
    ruleId: url_query_secret
    category: secrets
    input: "https://api.example.com/export?token=canaryQueryTok0123456789&user=jane"
    expectations:
      minimal:
        active: true
        output: "https://api.example.com/export?token=<SECRET>&user=jane"
      standard:
        active: true
        output: "https://api.example.com/export?token=<SECRET>&user=jane"
      maximum:
        active: true
        output: "https://api.example.com/export?token=<SECRET>&user=jane"

  - name: cookie_request_header
    ruleId: cookie_header
    category: secrets
    input: "Cookie: sessionid=canarySessionCookie0123456789abcdef"
    expectations:
      minimal:
        active: true
        output: "Cookie: <COOKIE>"
      standard:
        active: true
        output: "Cookie: <COOKIE>"
      maximum:
        active: true
        output: "Cookie: <COOKIE>"

  - name: cookie_response_header
    ruleId: cookie_header
    category: secrets
    input: "Set-Cookie: sessionid=canarySetCookie0123456789; Path=/; HttpOnly"
    expectations:
      minimal:
        active: true
        output: "Set-Cookie: <COOKIE>"
      standard:
        active: true
        output: "Set-Cookie: <COOKIE>"
      maximum:
        active: true
        output: "Set-Cookie: <COOKIE>"

  - name: stripe_key_long_body
    ruleId: stripe_key
    category: secrets
    input: "sk_live_abcdefghijklmnopqrstuvwxyz01"
    expectations:
      minimal:
        active: true
        output: "<STRIPE_KEY>"
      standard:
        active: true
        output: "<STRIPE_KEY>"
      maximum:
        active: true
        output: "<STRIPE_KEY>"

  - name: vendor_token_keeps_its_label
    ruleId: github_pat
    category: secrets
    input: "GITHUB_TOKEN=ghp_abcdefghijklmnopqrstuvwxyz0123456789"
    expectations:
      minimal:
        active: true
        output: "GITHUB_TOKEN=<GITHUB_PAT>"
      standard:
        active: true
        output: "GITHUB_TOKEN=<GITHUB_PAT>"
      maximum:
        active: true
        output: "GITHUB_TOKEN=<GITHUB_PAT>"

  - name: longer_match_wins_at_one_offset
    ruleId: key_name_secret
    category: secrets
    input: 'api_key = "canaryKey0123456789abcdef-part!9"'
    expectations:
      minimal:
        active: true
        output: 'api_key = "<SECRET>"'
      standard:
        active: true
        output: 'api_key = "<SECRET>"'
      maximum:
        active: true
        output: 'api_key = "<SECRET>"'

# Reviewed manifest of the secret-rule rows above. The loader asserts exact
# membership in both directions.
requiredSecretCaseNames:
  - key_name_env_assignment
  - key_name_json_text
  - key_name_escaped_json_text
  - key_name_command_flag
  - key_name_trailing_punctuation_kept
  - url_query_token
  - cookie_request_header
  - cookie_response_header
  - stripe_key_long_body
  - vendor_token_keeps_its_label
  - longer_match_wins_at_one_offset
