  - {name: project_directly_under_home, operation: generate, harness: claude-code, projectPath: /Users/alice/app, input: 'Fix /Users/alice/app/src/auth.go', output: 'Fix /<PATH>/app/src/auth.go', categories: [PATH]}
  - {name: unrelated_home_path, operation: sanitize, harness: claude-code, projectPath: /Users/alice/work/app, input: 'Read /Users/alice/private/notes.txt', output: 'Read /<PATH>', categories: [PATH]}
  - {name: linux_project_path, operation: sanitize, harness: opencode, projectPath: /home/alice/work/app, input: 'Edit /home/alice/work/app/main.go', output: 'Edit /<PATH>/app/main.go', categories: [PATH]}
  - {name: nested_project_becomes_path_project, operation: generate, harness: claude-code, projectPath: /home/alice/dev/app, input: 'Fix /home/alice/dev/app/src/auth.go', output: 'Fix /<PATH>/app/src/auth.go', categories: [PATH], why: 'a title keeps the project folder and the file below it; every folder above the project, the account name included, becomes one placeholder'}
  - {name: home_direct_project_becomes_path_project, operation: sanitize, harness: claude-code, projectPath: /home/alice/app, input: 'Fix /home/alice/app/src/auth.go', output: 'Fix /<PATH>/app/src/auth.go', categories: [PATH], why: 'a project directly under the home folder gets the same canonical root as a nested one, so the shape does not depend on how deep the project sits'}
  - {name: unrelated_home_path_collapses_to_path, operation: sanitize, harness: claude-code, projectPath: /home/alice/dev/app, input: 'Read /home/bob/secret/notes', output: 'Read /<PATH>', categories: [PATH], why: 'a home path that is not under the project keeps no folder name at all, because nothing below an unrelated home folder is safe to publish'}
  - {name: windows_project_path, operation: sanitize, harness: claude-code, projectPath: 'C:\Users\alice\dev\app', input: 'Fix C:\Users\alice\dev\app\src\auth.go', output: 'Fix C:\<PATH>\app\src\auth.go', categories: [PATH], why: 'the Windows form keeps its volume letter and its separator, and collapses the same prefix as the Unix form'}
  - {name: already_canonical_is_idempotent, operation: sanitize, harness: claude-code, projectPath: /home/alice/dev/app, input: 'Fix /<PATH>/app/src/auth.go', output: 'Fix /<PATH>/app/src/auth.go', why: 'a forward regression guard, not a caught mutation: an already canonical title matches none of the path patterns today, so this row fails only if a later change makes the canonical form matchable again. Idempotency through the replacer itself is proved by the canonical_slug_idempotent row in the behavior fixtures', idempotent: true}
  - {name: old_user_path_form_converges, operation: sanitize, harness: claude-code, projectPath: /home/alice/dev/app, input: 'Fix /home/<USER>/<PATH>/app/src/auth.go', output: 'Fix /<PATH>/app/src/auth.go', categories: [PATH], why: 'a title stored by an earlier rule set carries two placeholders; it converges on the canonical form so one collection never shows two shapes of the same path'}
  - {name: windows_old_user_path_form_converges, operation: sanitize, harness: claude-code, projectPath: 'C:\Users\alice\dev\app', input: 'Fix C:\Users\<USER>\<PATH>\app\src\auth.go', output: 'Fix C:\<PATH>\app\src\auth.go', categories: [PATH], why: 'a Windows title stored by an earlier rule set converges on the canonical form too, keeping its volume letter and its separator, so the convergence rule is not Unix only'}
  - {name: redaction_before_unicode_cap, operation: generate, harness: claude-code, projectPath: /home/alice/development/workspace/app, input: 'Fix /home/alice/development/workspace/app/src/auth.go and keep this trailing note', output: 'Fix /<PATH>/app/src/auth.go and keep this trailing note', categories: [PATH], why: 'the raw title is longer than the code point cap and the redacted one is not; the whole trailing sentence survives only because the path collapses before the title is capped'}
