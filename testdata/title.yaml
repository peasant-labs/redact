  - {name: redact_before_cap, operation: generate, harness: claude-code, input: 'Implement ghp_abcdefghijklmnopqrstuvwxyz0123456789 and preserve this useful suffix after replacement', output: 'Implement <GITHUB_PAT> and preserve this useful suffix after replacement', categories: [CREDENTIAL]}
