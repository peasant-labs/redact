# Additional synthetic engine boundaries. The differential also consumes the
# existing rule, project, redactor, residue, false-positive, and title fixtures.
required_names:
  - same_span_rule_order
  - overlapping_matches
  - replacement_backreferences
  - literal_dollars
  - no_match
  - empty_input
  - uri_credentials_keep_host
  - aws_boundary_backreference
  - slack_webhook
  - dashed_credit_card_filter
  - ssh_email_filter
  - unicode_offsets
  - value_under_secret_name_covered_by_configured_rule
  - value_under_secret_name_cut_by_configured_rule
  - value_under_secret_name_with_configured_rule_on_name
  - value_under_secret_name_before_card_number
  - value_under_secret_name_cut_two_characters_past
  - value_under_secret_name_keeps_match_one_character_past
  - value_under_secret_name_after_partial_cover
  - value_under_secret_name_keeps_configured_rule_on_its_start
  - value_under_secret_name_after_two_configured_rules
  - value_under_secret_name_after_cover_and_crossing_match
  - value_under_secret_name_after_configured_rule_on_name_and_separator
  - configured_rule_longer_than_format_rule_at_one_offset
cases:
  # A match that starts inside the value cuts it when it ends two or more
  # characters after the value. One character after it is the character a
  # pattern takes behind its token, and the value match stands.
  - name: value_under_secret_name_cut_two_characters_past
    input: badge_token=canary77EMP12345 J
    output: 'badge_token=<SECRET><BADGE>'
    rules: [key_name_secret, badge]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 2, counts: {key_name_secret: 1, badge: 1}}
    patterns:
      - {id: badge, category: pii, pattern: 'EMP[0-9]+ J', replacement: '<BADGE>'}
  - name: value_under_secret_name_keeps_match_one_character_past
    input: badge_token=canary77EMP12345 J
    output: 'badge_token=<SECRET> J'
    rules: [key_name_secret, badge]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 2, counts: {key_name_secret: 1, badge: 1}}
    patterns:
      - {id: badge, category: pii, pattern: 'EMP[0-9]+ ', replacement: '<BADGE>'}
  # A match that starts before the name covers the start of the value. The
  # value match keeps the rest, and Detect still returns matches in offset
  # order although the value match now starts after a match inside the first.
  - name: value_under_secret_name_after_partial_cover
    input: xx token=abc12345INNERdef-rest9
    output: '<OUTER><SECRET>'
    rules: [outer, inner, key_name_secret]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 3, counts: {outer: 1, inner: 1, key_name_secret: 1}}
    patterns:
      - {id: outer, category: secrets, pattern: 'xx token=abc12345INNERdef', replacement: '<OUTER>'}
      - {id: inner, category: secrets, pattern: 'INNER', replacement: '<INNER>'}
  # A configured rule's match that reads the name and stops inside the value
  # is never dropped for the value match: it is applied, and the value match
  # keeps the rest of the value.
  - name: value_under_secret_name_keeps_configured_rule_on_its_start
    input: auth_token=canary12345xyz
    output: '<UA><SECRET>'
    rules: [ua, key_name_secret]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 2, counts: {ua: 1, key_name_secret: 1}}
    patterns:
      - {id: ua, category: secrets, pattern: 'auth_token=[a-z]+', replacement: '<UA>'}
  # Two configured matches: the first is applied, the second starts inside it
  # and is skipped, and the value match starts where the first one ends, not
  # where the skipped one ends.
  - name: value_under_secret_name_after_two_configured_rules
    input: AAAA password=canary12345xyz99
    output: '<A>word=<SECRET>'
    rules: [head, across, key_name_secret]
    stable: true
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 3, counts: {head: 1, across: 1, key_name_secret: 1}}
    patterns:
      - {id: head, category: secrets, pattern: 'AAAA pass', replacement: '<A>'}
      - {id: across, category: secrets, pattern: 'A password=canary12', replacement: '<B>'}
  # A configured match covers the start of the value, and another starts inside
  # the first and ends past the value. The value match keeps what lies between
  # the end of the first and the end of the value; the second is skipped.
  - name: value_under_secret_name_after_cover_and_crossing_match
    input: xx token=canary12345INNERdef-rest9 tail
    output: '<OUTER><SECRET> tail'
    rules: [outer, inner, key_name_secret]
    stable: true
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 3, counts: {outer: 1, inner: 1, key_name_secret: 1}}
    patterns:
      - {id: outer, category: secrets, pattern: 'xx token=canary12345INNERdef', replacement: '<OUTER>'}
      - {id: inner, category: secrets, pattern: 'INNERdef-rest9 ta', replacement: '<INNER>'}
  # A configured match on the name and the separator touches the value and
  # does not overlap it; both are applied, and a second pass changes nothing.
  - name: value_under_secret_name_after_configured_rule_on_name_and_separator
    input: ACME_DB_PASSWORD=canaryPw0rd2026
    output: '<ENV_NAME><SECRET>'
    rules: [env_name, key_name_secret]
    stable: true
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 2, counts: {env_name: 1, key_name_secret: 1}}
    patterns:
      - {id: env_name, category: project, pattern: 'ACME_[A-Z_]+=', replacement: '<ENV_NAME>'}
  # Two matches at one offset: the longer one comes first and is applied,
  # whichever rule table it comes from.
  - name: configured_rule_longer_than_format_rule_at_one_offset
    input: ghp_canary0123456789abcdefghijklmnopqrst-tail
    output: '<TOKEN_TAIL>'
    rules: [token_tail, github_pat]
    stable: true
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 2, counts: {token_tail: 1, github_pat: 1}}
    patterns:
      - {id: token_tail, category: secrets, pattern: 'ghp_[A-Za-z0-9]{36}-tail', replacement: '<TOKEN_TAIL>'}
  # A key-name match spans the value alone and is settled against the matches
  # of every other rule, configured rules included. Report counts hold only the
  # matches that remain, so a count never names a redaction that was not made.
  - name: value_under_secret_name_covered_by_configured_rule
    input: badge_token=EMP12345 Jane Smith
    output: 'badge_token=<BADGE>'
    rules: [badge]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 1, counts: {badge: 1}}
    patterns:
      - {id: badge, category: pii, pattern: 'EMP[0-9]+ [A-Z][a-z]+ [A-Z][a-z]+', replacement: '<BADGE>'}
  - name: value_under_secret_name_cut_by_configured_rule
    input: badge_token=canary77EMP12345 Jane Smith
    output: 'badge_token=<SECRET><BADGE>'
    rules: [key_name_secret, badge]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 2, counts: {key_name_secret: 1, badge: 1}}
    patterns:
      - {id: badge, category: pii, pattern: 'EMP[0-9]+ [A-Z][a-z]+ [A-Z][a-z]+', replacement: '<BADGE>'}
  - name: value_under_secret_name_with_configured_rule_on_name
    input: ACME_DB_PASSWORD=canaryPw0rd2026
    output: '<ENV_NAME>=<SECRET>'
    rules: [env_name, key_name_secret]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 2, counts: {env_name: 1, key_name_secret: 1}}
    patterns:
      - {id: env_name, category: project, pattern: 'ACME_[A-Z_]+', replacement: '<ENV_NAME>'}
  - name: value_under_secret_name_before_card_number
    input: password=canaryPw0rd2026,card=4111 1111 1111 1111
    output: 'password=<SECRET>,card=<CREDIT_CARD>'
    rules: [key_name_secret, credit_card]
    required_report_names: [first_call, repeated_call]
    reports:
      - {name: first_call, total: 2, counts: {key_name_secret: 1, credit_card: 1}}
      - {name: repeated_call, total: 4, counts: {key_name_secret: 2, credit_card: 2}}
  - name: same_span_rule_order
    input: token
    output: '<FIRST>'
    rules: [first, second]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 2, counts: {first: 1, second: 1}}
    patterns:
      - {id: first, category: secrets, pattern: token, replacement: '<FIRST>'}
      - {id: second, category: secrets, pattern: token, replacement: '<SECOND>'}
  - name: overlapping_matches
    input: token suffix
    output: '<LONG>'
    rules: [long, contained]
    # Legacy Report counts accepted detections, including overlap losers.
    # The second snapshot is a repeated RedactText call on the same redactor.
    required_report_names: [first_call, repeated_call]
    reports:
      - {name: first_call, total: 2, counts: {long: 1, contained: 1}}
      - {name: repeated_call, total: 4, counts: {long: 2, contained: 2}}
    patterns:
      - {id: long, category: secrets, pattern: 'token suffix', replacement: '<LONG>'}
      - {id: contained, category: secrets, pattern: suffix, replacement: '<SHORT>'}
  - name: replacement_backreferences
    input: pair=ab:cd
    output: pair=cd-ab
    rules: [pair]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 1, counts: {pair: 1}}
    patterns:
      - {id: pair, category: secrets, pattern: '(ab):(cd)', replacement: '$2-${1}'}
  - name: literal_dollars
    input: token
    output: 'cost $$ and $literal'
    rules: [literal]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 1, counts: {literal: 1}}
    patterns:
      - {id: literal, category: secrets, pattern: token, replacement: 'cost $$ and $literal'}
  - name: no_match
    input: ordinary prose
    output: ordinary prose
    rules: []
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 0, counts: {}}
  - name: empty_input
    input: ''
    output: ''
    rules: []
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 0, counts: {}}
  - name: uri_credentials_keep_host
    input: 'https://alice:password@internal.test/path'
    output: 'https://<BASIC_AUTH_URI>@internal.test/path'
    rules: [basic_auth_uri, email]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 2, counts: {basic_auth_uri: 1, email: 1}}
  - name: aws_boundary_backreference
    input: 'aws_secret_access_key="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" next'
    output: 'aws_secret_access_key="<AWS_SECRET_KEY>" next'
    rules: [aws_secret_key]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 1, counts: {aws_secret_key: 1}}
  - name: slack_webhook
    input: 'https://hooks.slack.com/services/T123/B456/abc789'
    output: '<SLACK_WEBHOOK_URL>'
    rules: [slack_webhook_url]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 1, counts: {slack_webhook_url: 1}}
  - name: dashed_credit_card_filter
    input: 'card: 4111-1111-1111-1112'
    output: 'card: 4111-1111-1111-1112'
    rules: []
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 0, counts: {}}
  - name: ssh_email_filter
    input: 'git@github.com:org/repo.git'
    output: 'git@github.com:org/repo.git'
    rules: []
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 0, counts: {}}
  - name: unicode_offsets
    input: '你好 🦊 user@example.com /data/alice/config'
    output: '你好 🦊 <EMAIL> /data/<USER>/config'
    rules: [email, xdg_data_home]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 2, counts: {email: 1, xdg_data_home: 1}}

literal_replacement: '$1${2}$$'
invalid_pattern: '('
xdg_data_home: /data/alice/share
routing_input: /home/alice/project
title_routing_input: user@example.com
required_operations: [Detect, Redact, RedactText, RedactJSON, RedactMetadata, RedactJSONLBytes, RedactJSONDocBytes, Generate, Sanitize, Scan]
operations: [Detect, Redact, RedactText, RedactJSON, RedactMetadata, RedactJSONLBytes, RedactJSONDocBytes, Generate, Sanitize, Scan]
