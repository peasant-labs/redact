# Additional synthetic engine boundaries. The differential also consumes the
# existing rule, project, redactor, residue, false-positive, and title fixtures.
required_names:
  - same_span_rule_order
  - overlapping_matches
  - replacement_backreferences
  - literal_dollars
  - no_match
  - empty_input
  - uri_credentials_keep_host
  - aws_boundary_backreference
  - slack_webhook
  - dashed_credit_card_filter
  - ssh_email_filter
  - unicode_offsets
cases:
  - name: same_span_rule_order
    input: token
    output: '<FIRST>'
    rules: [first, second]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 2, counts: {first: 1, second: 1}}
    patterns:
      - {id: first, category: secrets, pattern: token, replacement: '<FIRST>'}
      - {id: second, category: secrets, pattern: token, replacement: '<SECOND>'}
  - name: overlapping_matches
    input: token suffix
    output: '<LONG>'
    rules: [long, contained]
    # Legacy Report counts accepted detections, including overlap losers.
    # The second snapshot is a repeated RedactText call on the same redactor.
    required_report_names: [first_call, repeated_call]
    reports:
      - {name: first_call, total: 2, counts: {long: 1, contained: 1}}
      - {name: repeated_call, total: 4, counts: {long: 2, contained: 2}}
    patterns:
      - {id: long, category: secrets, pattern: 'token suffix', replacement: '<LONG>'}
      - {id: contained, category: secrets, pattern: suffix, replacement: '<SHORT>'}
  - name: replacement_backreferences
    input: pair=ab:cd
    output: pair=cd-ab
    rules: [pair]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 1, counts: {pair: 1}}
    patterns:
      - {id: pair, category: secrets, pattern: '(ab):(cd)', replacement: '$2-${1}'}
  - name: literal_dollars
    input: token
    output: 'cost $$ and $literal'
    rules: [literal]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 1, counts: {literal: 1}}
    patterns:
      - {id: literal, category: secrets, pattern: token, replacement: 'cost $$ and $literal'}
  - name: no_match
    input: ordinary prose
    output: ordinary prose
    rules: []
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 0, counts: {}}
  - name: empty_input
    input: ''
    output: ''
    rules: []
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 0, counts: {}}
  - name: uri_credentials_keep_host
    input: 'https://alice:password@internal.test/path'
    output: 'https://<BASIC_AUTH_URI>@internal.test/path'
    rules: [basic_auth_uri, email]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 2, counts: {basic_auth_uri: 1, email: 1}}
  - name: aws_boundary_backreference
    input: 'aws_secret_access_key="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" next'
    output: 'aws_secret_access_key="<AWS_SECRET_KEY>" next'
    rules: [aws_secret_key]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 1, counts: {aws_secret_key: 1}}
  - name: slack_webhook
    input: 'https://hooks.slack.com/services/T123/B456/abc789'
    output: '<SLACK_WEBHOOK_URL>'
    rules: [slack_webhook_url]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 1, counts: {slack_webhook_url: 1}}
  - name: dashed_credit_card_filter
    input: 'card: 4111-1111-1111-1112'
    output: 'card: 4111-1111-1111-1112'
    rules: []
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 0, counts: {}}
  - name: ssh_email_filter
    input: 'git@github.com:org/repo.git'
    output: 'git@github.com:org/repo.git'
    rules: []
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 0, counts: {}}
  - name: unicode_offsets
    input: '你好 🦊 user@example.com /data/alice/config'
    output: '你好 🦊 <EMAIL> /data/<USER>/config'
    rules: [email, xdg_data_home]
    required_report_names: [first_call]
    reports:
      - {name: first_call, total: 2, counts: {email: 1, xdg_data_home: 1}}

literal_replacement: '$1${2}$$'
invalid_pattern: '('
xdg_data_home: /data/alice/share
routing_input: /home/alice/project
title_routing_input: user@example.com
required_operations: [Detect, Redact, RedactText, RedactJSON, RedactMetadata, RedactJSONLBytes, RedactJSONDocBytes, Generate, Sanitize, Scan]
operations: [Detect, Redact, RedactText, RedactJSON, RedactMetadata, RedactJSONLBytes, RedactJSONDocBytes, Generate, Sanitize, Scan]
