ord:
  - id: ord-minimal
    level: minimal
    want: 0
    want_string: minimal
  - id: ord-standard
    level: standard
    want: 1
    want_string: standard
  - id: ord-maximum
    level: maximum
    want: 2
    want_string: maximum
  - id: ord-unknown
    level: bogus
    want: -1
