    b: standard
    want: standard
  - id: max-minimal-minimal
    a: minimal
    b: minimal
    want: minimal
  - id: max-maximum-maximum
    a: maximum
    b: maximum
    want: maximum
  - id: max-minimal-maximum
    a: minimal
    b: maximum
    want: maximum

valid:
  - id: valid-minimal
    level: minimal
    want: true
  - id: valid-standard
    level: standard
    want: true
  - id: valid-maximum
    level: maximum
    want: true
  - id: invalid-empty
    level: ""
    want: false
