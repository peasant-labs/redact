awsFilters:
  - {name: file_path_no_context, input: 'nttea/codebases/dayvidpham/bestiary/main.', wantDetect: false}
  - {name: real_key_with_context, input: 'aws_secret_access_key = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"', wantDetect: true}
  - {name: akia_nearby, input: 'AKIAIOSFODNN7EXAMPLE1234 wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY', wantDetect: true}
  - {name: sequential_string, input: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcd', wantDetect: false}
  - {name: bare_base64, input: '5Y9syZ8W5sLJHHGM7EqzeVBf37Sq/f4k1p0YAQAA', wantDetect: false}
  - {name: key_at_end, input: 'aws_secret_key=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY', wantDetect: true}
  - {name: keyword_inside_window, input: 'aws_secret xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx5Y9syZ8W5sLJHHGM7EqzeVBf37Sq0f4k1p0YAQAA', wantDetect: true}
  - {name: keyword_outside_window, input: 'aws_secret xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx5Y9syZ8W5sLJHHGM7EqzeVBf37Sq0f4k1p0YAQAA', wantDetect: false}

extractBase64:
  - {name: trailing_space, matched: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY ', want: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'}
  - {name: trailing_newline, matched: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\n", want: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'}
  - {name: trailing_colon, matched: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY:', want: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'}
  - {name: base64_padding, matched: '5Y9syZ8W5sLJHHGM7EqzeVBf37Sq/f4k1p0YAQ==', want: '5Y9syZ8W5sLJHHGM7EqzeVBf37Sq/f4k1p0YAQ=='}
  - {name: end_of_string, matched: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY', want: 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'}
  - {name: empty, matched: '', want: ''}

homePaths:
  - {name: dual_path_keeps_alice, input: 'Loaded config from /home/alice and /home/bob/x', offset: 19, matched: '/home/alice', want: true}
  - {name: spaced_username_rejects_prefix, input: '/home/SFU CLASSES/project/file.go', offset: 0, matched: '/home/SFU', want: false}

coveredRuleIds:
  - anthropic_key
  - openai_key
  - github_pat
  - aws_access_key
  - aws_secret_key
  - stripe_key
