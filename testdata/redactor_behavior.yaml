  jwk_private_members: [d, p, q, dp, dq, qi, k]
  header_value_keys: [authorization, cookie, set-cookie]
# The closed lists the key-name rules and the curl rule read a name, a message
# and a password by. The test asserts exact membership against the compiled
# lists.
