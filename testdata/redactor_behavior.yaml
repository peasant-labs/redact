  - {id: slug_after_space, level: standard, input: " -home-alice-dev-project", contains: "-home-<USER>-"}
  - {id: slug_after_slash, level: standard, input: "/-home-alice-dev-project", contains: "-home-<USER>-"}
  - {id: unix_path_at_minimal, level: minimal, input: "/home/alice/dev/project", contains: "/home/<USER>/dev/project"}
code_blocks:
  - {id: standard_fences, input: "before\n```\nsome secret code\n```\nafter", want: "before<CODE_BLOCK>after"}
  - {id: indented_fences, input: "before\n    ```\n    indented code\n    ```\nafter", want: "before<CODE_BLOCK>after"}
  - {id: no_fences, input: "just normal text with no code blocks", want: "just normal text with no code blocks"}
  - {id: fences_with_lang, input: "text\n```go\npackage main\n```\nmore", want: "text<CODE_BLOCK>more"}
parity:
  - {id: file_path_false_positive, level: minimal, input: "nttea/codebases/dayvidpham/bestiary/main.", want: "nttea/codebases/dayvidpham/bestiary/main."}
  - {id: bare_base64_no_context, level: minimal, input: "5Y9syZ8W5sLJHHGM7EqzeVBf37Sq/f4k1p0YAQAA", want: "5Y9syZ8W5sLJHHGM7EqzeVBf37Sq/f4k1p0YAQAA"}
  - {id: real_aws_key_with_context, level: minimal, input: 'aws_secret_access_key = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"', want: 'aws_secret_access_key = "<AWS_SECRET_KEY>"'}
  - {id: back_reference_unix_home_path, level: minimal, input: "/home/alice/dev/project", want: "/home/<USER>/dev/project"}
  - {id: back_reference_claude_project_slug, level: minimal, input: "/home/<USER>/.claude/projects/-home-alice-dev-project/uuid.jsonl", want: "/home/<USER>/.claude/projects/-home-<USER>-dev-project/uuid.jsonl"}

code_pipeline:
  - id: standard_preserves_code_and_redacts_secret
    level: standard
    input: |-
      outside api_key=abc123def456abc123def456abc123def456
      ```go
      func preserveIdentifier() {
        key := "api_key=def456abc123def456abc123def456abc123"
      }
      ```
    contains: ["```go", "func preserveIdentifier()", "<API_KEY>"]
    absent: ["<CODE_BLOCK>", "abc123def456abc123def456abc123def456", "def456abc123def456abc123def456abc123"]
  - id: maximum_anonymizes_identifier
    level: maximum
    input: |-
      ```go
      func anonymizeIdentifier() error { return nil }
      ```
    contains: ["```go"]
    absent: ["anonymizeIdentifier", "<CODE_BLOCK>"]

# metadata_paths drives RedactMetadata, the context-aware stage that knows the
# owner of the session. Every folder above the project folder, the account name
# included, collapses into one placeholder in all three separator forms.
metadata_paths:
  - id: nested_project_becomes_path_project
    why: a project below an intermediate folder keeps only its own folder name, so a published path names the project and nothing about the machine it sat on
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    project_file_path: /home/alice/dev/app
    host_slug: laptop--home--alice--dev--app
    want_source_file_path: /<PATH>/.claude/projects/-<PATH>-app/uuid.jsonl
    want_cwd: /<PATH>/app
    want_project_file_path: /<PATH>/app
    want_host_slug: laptop--<PATH>--app
  - id: home_direct_project_becomes_path_project
    why: a project directly under the home folder gets the same canonical form as a nested one, so the published shape does not reveal how deep the project sat
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-app/uuid.jsonl
    cwd: /home/alice/app
    project_file_path: /home/alice/app
    host_slug: laptop--home--alice--app
    want_source_file_path: /<PATH>/.claude/projects/-<PATH>-app/uuid.jsonl
    want_cwd: /<PATH>/app
    want_project_file_path: /<PATH>/app
    want_host_slug: laptop--<PATH>--app
  - id: claude_slug_becomes_path_slug
    why: the single-dash project slug is a path written with dashes; it collapses with the same rule as the path so the two forms of one location agree
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    want_source_file_path: /<PATH>/.claude/projects/-<PATH>-app/uuid.jsonl
  - id: peasant_host_slug_becomes_path_slug
    why: the double-dash host slug is the same location again; it collapses to the same placeholder, so no separator form leaks the account name
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    host_slug: laptop--home--alice--dev--app
    want_host_slug: laptop--<PATH>--app
  - id: legacy_user_slug_converges
    why: values stored by an earlier rule set carry two placeholders in every separator form; they converge on the canonical one so a collection never mixes two shapes of the same location
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    project_file_path: /home/<USER>/<PATH>/app
    project_name: -home-<USER>-<PATH>-app
    host_slug: laptop--home--<USER>--<PATH>--app
    want_project_file_path: /<PATH>/app
    want_project_name: -<PATH>-app
    want_host_slug: laptop--<PATH>--app
  - id: canonical_slug_idempotent
    why: an already canonical value passes through the active replacer unchanged, so redacting a stored session again is safe
    level: standard
    source_file_path: /home/alice/.claude/projects/-<PATH>-app/uuid.jsonl
    cwd: /home/alice/dev/app
    project_file_path: /<PATH>/app
    project_name: -<PATH>-app
    host_slug: laptop--<PATH>--app
    want_source_file_path: /<PATH>/.claude/projects/-<PATH>-app/uuid.jsonl
    want_project_file_path: /<PATH>/app
    want_project_name: -<PATH>-app
    want_host_slug: laptop--<PATH>--app
    idempotent: true
