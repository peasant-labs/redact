code_pipeline:
  - id: standard_preserves_code_and_redacts_secret
    level: standard
    input: |-
      outside api_key=abc123def456abc123def456abc123def456
      ```go
      func preserveIdentifier() {
        key := "api_key=def456abc123def456abc123def456abc123"
      }
      ```
    contains: ["```go", "func preserveIdentifier()", "<API_KEY>"]
    absent: ["<CODE_BLOCK>", "abc123def456abc123def456abc123def456", "def456abc123def456abc123def456abc123"]
  - id: maximum_anonymizes_identifier
    level: maximum
    input: |-
      ```go
      func anonymizeIdentifier() error { return nil }
      ```
    contains: ["```go"]
    absent: ["anonymizeIdentifier", "<CODE_BLOCK>"]
