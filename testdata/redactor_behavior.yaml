  - {id: claude_project_slug_users_variant, level: standard, input: " -Users-johndoe-dev-project", contains: "-Users-<USER>-"}
  - {id: peasant_host_slug_minimal, level: minimal, input: " --home--alice--dev--project", contains: "--home--<USER>--"}
  - {id: peasant_host_slug_users_variant, level: standard, input: " --Users--johndoe--dev--project", contains: "--Users--<USER>--"}
