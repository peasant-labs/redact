  - {id: aws_access_key, level: minimal, input: "AKIAIOSFODNN7EXAMPLE", contains: "<AWS_ACCESS_KEY>"}
  - {id: aws_secret_key, level: minimal, input: 'aws_secret_access_key = "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" next', contains: "<AWS_SECRET_KEY>"}
