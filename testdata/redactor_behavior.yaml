code_pipeline:
  - id: standard_preserves_code_and_redacts_secret
    level: standard
    input: |-
      outside api_key=abc123def456abc123def456abc123def456
      ```go
      func preserveIdentifier() {
        key := "api_key=def456abc123def456abc123def456abc123"
      }
      ```
    contains: ["```go", "func preserveIdentifier()", "<API_KEY>"]
    absent: ["<CODE_BLOCK>", "abc123def456abc123def456abc123def456", "def456abc123def456abc123def456abc123"]
  - id: maximum_anonymizes_identifier
    level: maximum
    input: |-
      ```go
      func anonymizeIdentifier() error { return nil }
      ```
    contains: ["```go"]
    absent: ["anonymizeIdentifier", "<CODE_BLOCK>"]

# metadata_paths drives RedactMetadata, the context-aware stage that knows every
# path the session recorded. Everything above the last folder of a recorded path,
# the account name included, collapses into one placeholder in all three
# separator forms. The prefixes come from every recorded path, so a value whose
# shape differs from the working directory is covered too.
json_keys:
  - id: secret_named_key_redacts_value
    why: a JSON object key names the value it holds, so a password under a secret name is redacted although the value alone has no known format
    level: standard
    json: '{"db_password": "canaryJsonPw0rd!2026", "user": "jane"}'
    want: '{"db_password": "<SECRET>", "user": "jane"}'
    key_redactions: 1
  - id: secret_named_key_redacts_value_at_minimal
    why: the key-name rule is in the secrets category, so the JSON form is active at minimal like the text form
    level: minimal
    json: '{"db_password": "canaryJsonPw0rd!2026"}'
    want: '{"db_password": "<SECRET>"}'
    key_redactions: 1
  - id: nested_secret_named_key
    why: the key test applies at every depth of the document
    level: standard
    json: '{"config": {"database": {"clientSecret": "canaryCamel-9f8e7d6c5b4a"}}}'
    want: '{"config": {"database": {"clientSecret": "<SECRET>"}}}'
    key_redactions: 1
  - id: secret_named_key_inside_array
    why: objects inside an array are walked with the same key test
    level: standard
    json: '[{"name": "ci", "access_token": "canaryArrayTok0123456789"}]'
    want: '[{"name": "ci", "access_token": "<SECRET>"}]'
    key_redactions: 1
  - id: vendor_token_under_secret_name_keeps_label
    why: a value a format rule covers whole keeps the more specific placeholder
    level: standard
    json: '{"token": "ghp_abcdefghijklmnopqrstuvwxyz0123456789"}'
    want: '{"token": "<GITHUB_PAT>"}'
  - id: ordinary_key_with_same_value_unchanged
    why: the key decides; the same value under an ordinary name is not a finding
    level: standard
    json: '{"build_label": "canaryJsonPw0rd!2026"}'
    want: '{"build_label": "canaryJsonPw0rd!2026"}'
  - id: variable_reference_value_unchanged
    why: a reference to a variable holds no credential
    level: standard
    json: '{"api_token": "${DEPLOY_TOKEN_VALUE}"}'
    want: '{"api_token": "${DEPLOY_TOKEN_VALUE}"}'
  - id: placeholder_value_unchanged
    why: a template is not a credential
    level: standard
    json: '{"password": "<your-password>"}'
    want: '{"password": "<your-password>"}'
  - id: type_name_value_unchanged
    why: a schema that names the type of a field holds no credential
    level: standard
    json: '{"password": "string", "token": "undefined"}'
    want: '{"password": "string", "token": "undefined"}'
  - id: token_count_unchanged
    why: a number is never a string value, and a plural name does not end in a secret word
    level: standard
    json: '{"max_tokens": 4096, "input_tokens": 10, "token": 12}'
    want: '{"max_tokens": 4096, "input_tokens": 10, "token": 12}'
  - id: description_with_spaces_unchanged
    why: a value with spaces under a secret name is a description, the same call the text form makes
    level: standard
    json: '{"token": "The API token to send with each request"}'
    want: '{"token": "The API token to send with each request"}'
  - id: object_under_secret_name_is_walked
    why: only a string value is taken whole; an object under a secret name is walked, and its own keys are tested
    level: standard
    json: '{"auth": {"username": "jane", "password": "canaryNestedPw0rd!41"}}'
    want: '{"auth": {"username": "jane", "password": "<SECRET>"}}'
    key_redactions: 1
  - id: strict_ending_short_value_unchanged
    why: a name that ends in auth often holds a scheme or a mode, so only a long value that mixes letters and digits is taken
    level: standard
    json: '{"auth": "basic-realm-2026"}'
    want: '{"auth": "basic-realm-2026"}'
  - id: text_inside_string_value_still_scanned
    why: a string under an ordinary key is still scanned as text, so an assignment written inside it is redacted in place
    level: standard
    json: '{"command": "export INTERNAL_API_TOKEN=canary-9f8e7d6c5b4a3928"}'
    want: '{"command": "export INTERNAL_API_TOKEN=<SECRET>"}'
    key_redactions: 1
  - id: model_output_token_unchanged
    why: an entry of a token-probability list holds a piece of model output under "token"; the log probability beside it says it is not a credential
    level: standard
    json: '{"token": "localhost:8080x", "logprob": -0.1, "bytes": [1, 2]}'
    want: '{"token": "localhost:8080x", "logprob": -0.1, "bytes": [1, 2]}'
  - id: web_key_private_members
    why: in an object that carries a key type, every private member is replaced and the public members stay, so the output still shows which key it was
    level: minimal
    json: '{"kty": "RSA", "n": "canaryModulus0123456789abcdefghijklmnop", "e": "AQAB", "d": "canaryPrivateMember0123456789abcdefghijklmn", "p": "canaryPrimeMember0123456789abcdefghijklmnop", "q": "canaryPrimeMember9876543210abcdefghijklmnop"}'
    want: '{"kty": "RSA", "n": "canaryModulus0123456789abcdefghijklmnop", "e": "AQAB", "d": "<JWK_PRIVATE_KEY>", "p": "<JWK_PRIVATE_KEY>", "q": "<JWK_PRIVATE_KEY>"}'
    key_redactions: 3
  - id: web_key_public_key_unchanged
    why: a public key has no private member, and nothing in it is a credential
    level: minimal
    json: '{"kty": "EC", "crv": "P-256", "x": "canaryPublicX", "y": "canaryPublicY"}'
    want: '{"kty": "EC", "crv": "P-256", "x": "canaryPublicX", "y": "canaryPublicY"}'
  - id: private_member_name_without_key_type_unchanged
    why: a member named d in an object with no key type is ordinary data
    level: minimal
    json: '{"d": "canaryNotAKeyValue0123456789abcdefg", "name": "delta"}'
    want: '{"d": "canaryNotAKeyValue0123456789abcdefg", "name": "delta"}'
  - id: password_beside_log_probability
    why: a log probability excuses only the "token" member beside it; any other secret-named member of that object is still a credential
    level: standard
    json: '{"token": "localhost:8080x", "logprob": -0.1, "password": "canaryJsonPw0rd!2026"}'
    want: '{"token": "localhost:8080x", "logprob": -0.1, "password": "<SECRET>"}'
    key_redactions: 1
  - id: authorization_header_key
    why: a decoded request holds the header name as the key and the value apart from it, so the value is read as the value of that header
    level: minimal
    json: '{"headers": {"Authorization": "token canaryAuthTok0123456789abcd", "Accept": "application/json"}}'
    want: '{"headers": {"Authorization": "token <AUTH_TOKEN>", "Accept": "application/json"}}'
  - id: cookie_header_key
    why: a cookie header in a decoded request is redacted like the header line
    level: minimal
    json: '{"headers": {"cookie": "sessionid=canarySessionCookie0123456789abcdef; theme=dark"}}'
    want: '{"headers": {"cookie": "<COOKIE>"}}'
  - id: header_key_with_placeholder_unchanged
    why: a placeholder under a header key is not a credential
    level: minimal
    json: '{"headers": {"Authorization": "token YOUR-TOKEN", "Cookie": "$SESSION_COOKIE"}}'
    want: '{"headers": {"Authorization": "token YOUR-TOKEN", "Cookie": "$SESSION_COOKIE"}}'
  - id: basic_authorization_header_key
    why: basic_auth replaces the header name together with the value, so nothing of the name is left to take off. The placeholder is the redacted value, and the value is not scanned a second time without its name.
    level: standard
    json: '{"Authorization": "Basic Y2FuYXJ5OmNhbmFyeXBhc3N3b3Jk"}'
    want: '{"Authorization": "<BASIC_AUTH>"}'
    counts: {basic_auth: 1}
  - id: header_key_value_is_counted_once
    why: The rule takes the space after the colon, so the redacted line no longer starts with the whole name. The value is still redacted in one pass and counted once.
    level: standard
    json: '{"authorization": "AKCcanary0123456789"}'
    want: '{"authorization": "<ARTIFACTORY_API_TOKEN>"}'
    counts: {artifactory_api_token: 1}
  - id: cookie_header_key_is_counted_once
    why: A value under a header key is one redaction in the report.
    level: standard
    json: '{"Cookie": "sessionid=canarySessionCookie0123456789abcdef"}'
    want: '{"Cookie": "<COOKIE>"}'
    counts: {cookie_header: 1}
  - id: value_with_trailing_line_end
    why: A decoded string is known whole, so the line end after the value is not part of it and does not make the value a description. The whole string is replaced.
    level: standard
    json: '{"password": "canaryPw0rd99x\n", "db_password": "  canaryPw0rd98x  "}'
    want: '{"password": "<SECRET>", "db_password": "<SECRET>"}'
    key_redactions: 2
  - id: value_with_brackets_inside
    why: A parenthesis or an angle bracket inside a value does not make it a call or a template; only a value that is one of those as a whole is kept.
    level: standard
    json: '{"password": "Xk9(canary2<vL7pR4", "db_password": "$ecret!Canary99", "token": "[canaryB3xkd92"}'
    want: '{"password": "<SECRET>", "db_password": "<SECRET>", "token": "<SECRET>"}'
    key_redactions: 3
  - id: value_starting_with_slash
    why: A credential in the base64 alphabet may start with a slash. One long segment that mixes letters and digits is not a path.
    level: standard
    json: '{"secret_key": "/canary0Fk29dLq0Pz71Xn5Rv3Tb6Yc4Wm2Qe8H", "private_key": "/etc/ssl/private/server-2026.key"}'
    want: '{"secret_key": "<SECRET>", "private_key": "/etc/ssl/private/server-2026.key"}'
    key_redactions: 1
  - id: weak_password_value
    why: A value of 8 or more characters that mixes letters and digits is redacted. Shorter values, letters alone and digits alone stay by decision.
    level: standard
    json: '{"password": "Summer2024", "db_password": "hunter2", "admin_password": "changeme", "pin_secret": "12345678"}'
    want: '{"password": "<SECRET>", "db_password": "hunter2", "admin_password": "changeme", "pin_secret": "12345678"}'
    key_redactions: 1
  - id: whole_value_call_unchanged
    why: A value that is a call, a type or a template as a whole is code, not a credential.
    level: standard
    json: '{"token": "getToken(user1)", "secret": "Optional<String1>", "password": "{password1}"}'
    want: '{"token": "getToken(user1)", "secret": "Optional<String1>", "password": "{password1}"}'
  - id: identifier_value_with_digit_unchanged
    why: A name made of words in which digits only end a word is an identifier.
    level: standard
    json: '{"token": "oauth2_token", "password": "sha256_password", "existingSecret": "db-credentials-prod2"}'
    want: '{"token": "oauth2_token", "password": "sha256_password", "existingSecret": "db-credentials-prod2"}'
unchanged_text:
  - id: shell_variable
    why: a variable reference holds no credential
    input: 'INTERNAL_API_TOKEN=$DEPLOY_TOKEN_VALUE'
  - id: braced_shell_variable
    why: a braced variable reference holds no credential
    input: 'INTERNAL_API_TOKEN=${DEPLOY_TOKEN_VALUE}'
  - id: process_environment_read
    why: reading the environment is code
    input: 'const token = process.env.INTERNAL_API_TOKEN'
  - id: environment_index_read
    why: reading the environment is code
    input: 'password = os.environ["DB_PASSWORD"]'
  - id: angle_template
    why: an angle-bracket template is a placeholder
    input: 'curl "https://api.example.test/export?token=<token>"'
  - id: placeholder_words
    why: a placeholder made of words is not a credential
    input: 'api_key=your_api_key and token=your_api_token'
  - id: asterisk_mask
    why: a mask means the value was already removed
    input: 'password=***'
  - id: ellipsis
    why: an ellipsis stands for an omitted value
    input: 'token: ...'
  - id: type_name
    why: a type name in a declaration is not a value
    input: 'password: string'
  - id: null_literal
    why: a null literal is not a value
    input: '{"token": null, "secret": "null"}'
  - id: true_literal
    why: a boolean literal is not a value
    input: 'use_token: true, secret=true'
  - id: maximum_token_count
    why: a token limit is a count
    input: 'max_tokens=4096'
  - id: input_token_count
    why: a token usage figure is a count
    input: 'input_tokens: 10'
  - id: name_only_contains_auth
    why: a name that contains a secret word and does not end in it is ordinary
    input: 'author=jane-doe-2026x authority: registry.example.test oauth_callback_url=/callback/2026x'
  - id: curl_other_command
    why: the user option of another command is not a credential
    input: 'sort -u names:canaryList0123 sorted.txt'
  - id: object_without_key_type
    why: a member named d outside a JSON Web Key is ordinary data
    input: '{"d": "canaryNotAKeyValue0123456789abcdefg", "name": "delta"}'
  - id: api_key_header_placeholder
    why: a template in an API-key header is not a credential
    input: 'api-key: <your-api-key>'
  - id: x_api_key_header_variable
    why: a variable reference in an API-key header is not a credential
    input: 'x-api-key: $SERVICE_API_KEY_VALUE_2026'
  - id: auth_token_header_placeholder
    why: a placeholder word in a token header is not a credential
    input: 'auth-token: your-auth-token'
  - id: access_token_header_variable
    why: a variable reference in a token header is not a credential
    input: 'access-token: ${SERVICE_ACCESS_TOKEN_2026}'
metadata_paths:
  - id: nested_project_becomes_path_project
    why: a project below an intermediate folder keeps only its own folder name, so a published path names the project and nothing about the machine it sat on
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    project_file_path: /home/alice/dev/app
    host_slug: laptop--home--alice--dev--app
    want_source_file_path: /<PATH>/uuid.jsonl
    want_cwd: /<PATH>/app
    want_project_file_path: /<PATH>/app
    want_host_slug: laptop--<PATH>--app
  - id: home_direct_project_becomes_path_project
    why: a project directly under the home folder gets the same canonical form as a nested one, so the published shape does not reveal how deep the project sat
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-app/uuid.jsonl
    cwd: /home/alice/app
    project_file_path: /home/alice/app
    host_slug: laptop--home--alice--app
    want_source_file_path: /<PATH>/uuid.jsonl
    want_cwd: /<PATH>/app
    want_project_file_path: /<PATH>/app
    want_host_slug: laptop--<PATH>--app
  - id: claude_slug_becomes_path_slug
    why: the single-dash project slug is a path written with dashes; it collapses with the same rule as the path so the two forms of one location agree
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    project_name: -home-alice-dev-app
    want_project_name: -<PATH>-app
    want_source_file_path: /<PATH>/uuid.jsonl
  - id: peasant_host_slug_becomes_path_slug
    why: the double-dash host slug is the same location again; it collapses to the same placeholder, so no separator form leaks the account name
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    host_slug: laptop--home--alice--dev--app
    want_host_slug: laptop--<PATH>--app
  - id: legacy_user_slug_converges
    why: values stored by an earlier rule set carry two placeholders in every separator form; they converge on the canonical one so a collection never mixes two shapes of the same location
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    project_file_path: /home/<USER>/<PATH>/app
    project_name: -home-<USER>-<PATH>-app
    host_slug: laptop--home--<USER>--<PATH>--app
    want_project_file_path: /<PATH>/app
    want_project_name: -<PATH>-app
    want_host_slug: laptop--<PATH>--app
  - id: canonical_slug_idempotent
    why: an already canonical value passes through the active replacer unchanged, so redacting a stored session again is safe
    level: standard
    source_file_path: /home/alice/.claude/projects/-<PATH>-app/uuid.jsonl
    cwd: /home/alice/dev/app
    project_file_path: /<PATH>/app
    project_name: -<PATH>-app
    host_slug: laptop--<PATH>--app
    want_source_file_path: /<PATH>/uuid.jsonl
    want_project_file_path: /<PATH>/app
    want_project_name: -<PATH>-app
    want_host_slug: laptop--<PATH>--app
    idempotent: true
  - id: monorepo_subpackage_keeps_project_root
    why: a harness started in a subpackage records a working directory deeper than the project root; the project root must still lose every folder above it instead of keeping the ones the working directory does not name
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-monorepo-packages-app/uuid.jsonl
    cwd: /home/alice/dev/monorepo/packages/app
    project_file_path: /home/alice/dev/monorepo
    host_slug: laptop--home--alice--dev--monorepo
    want_cwd: /<PATH>/app
    want_project_file_path: /<PATH>/monorepo
    want_host_slug: laptop--<PATH>--monorepo
  - id: project_outside_working_directory_tree
    why: a project root in a different tree than the working directory shares no folder with it; every folder of that tree, a client or company name included, must still be replaced
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-myproject/uuid.jsonl
    cwd: /home/alice/dev/myproject
    project_file_path: /home/alice/work/clients/acme/bigproject
    want_cwd: /<PATH>/myproject
    want_project_file_path: /<PATH>/bigproject
  - id: working_directory_below_project_root
    why: a working directory inside the project keeps only its own folder name and the project root keeps only its own, so neither value names the folders that lead to them
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app/services/api
    project_file_path: /home/alice/dev/app
    want_cwd: /<PATH>/api
    want_project_file_path: /<PATH>/app
  - id: mismatched_home_conventions_between_fields
    why: two values of one session can be written with different home folder conventions; each value is covered by a prefix taken from itself, so neither falls back to a weaker rule
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    project_file_path: /Users/alice/dev/app
    want_cwd: /<PATH>/app
    want_project_file_path: /<PATH>/app
  - id: project_redacted_without_home_rooted_source
    why: a transcript read from outside any home folder must not switch the context-aware stage off; the project root is still redacted from its own prefix
    level: standard
    source_file_path: /var/lib/peasant/session.jsonl
    cwd: /home/alice/dev/app
    project_file_path: /home/alice/dev/app
    want_cwd: /<PATH>/app
    want_project_file_path: /<PATH>/app
  - id: host_slug_diverging_folder_chain_collapses
    why: a host slug names a location the recorded paths do not name; it must lose its own folder chain, or a client or company folder survives in a published session while every other field is clean
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    project_file_path: /home/alice/dev/app
    host_slug: laptop--home--alice--work--clients--acme--secretproject
    want_project_file_path: /<PATH>/app
    want_host_slug: laptop--<PATH>--secretproject
  - id: project_name_slug_diverging_collapses
    why: the single-dash project slug can name its own folder chain too; the same rule applies to it so no separator form is left as the one that leaks
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    project_name: -home-alice-work-clients-acme-secretproject
    want_project_name: -<PATH>-secretproject
  - id: project_name_with_home_word_is_untouched
    why: an ordinary name can contain a home segment without being a location; a project name is read as one only when the VALUE STARTS with the marker, so a name that carries the segment part way through is never rewritten, whatever account it names
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    project_name: the-go-home-early-feature
    want_project_name: the-go-home-early-feature
  - id: windows_metadata_path_becomes_path_project
    why: a session recorded on Windows writes its paths with a volume letter and backslashes; it loses the folders above the project like any other path and keeps its volume letter, the same form a redacted title uses
    level: standard
    cwd: 'C:\Users\alice\dev\app'
    project_file_path: 'C:\Users\alice\dev\app'
    want_cwd: 'C:\<PATH>\app'
    want_project_file_path: 'C:\<PATH>\app'
  - id: host_slug_unknown_account_collapses
    why: a host slug is a location by construction, so it is read as one even when the account in it is not the account of any recorded path; that mismatch is exactly the case no other prefix can cover
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    project_file_path: /home/alice/dev/app
    host_slug: laptop--home--bob--work--clients--acme--secretproject
    want_project_file_path: /<PATH>/app
    want_host_slug: laptop--<PATH>--secretproject
  - id: host_slug_without_any_home_rooted_path_collapses
    why: a session can record every path outside a home folder, on a network mount or in a container, and still carry a host slug minted against one; the slug must still lose its account name and its folder chain
    level: standard
    source_file_path: /var/lib/peasant/session.jsonl
    cwd: /var/lib/peasant/workdir
    project_file_path: /mnt/data/clients/acme/secretproject
    host_slug: laptop--home--alice--work--clients--acme--secretproject
    want_host_slug: laptop--<PATH>--secretproject
  - id: project_name_slug_unknown_account_collapses
    why: a project name that is a slug from its first character is a location whatever account it names, so the single-dash form is covered by the same reading as the host slug
    level: standard
    source_file_path: /home/alice/.claude/projects/-home-alice-dev-app/uuid.jsonl
    cwd: /home/alice/dev/app
    project_name: -home-bob-work-clients-acme-secretproject
    want_project_name: -<PATH>-secretproject
  - id: host_slug_account_only_collapses
    why: a session run straight from the home folder has no project folder to keep, so its host slug is the marker and the account name alone; the account name is still the owner and the slug must collapse to the placeholder rather than return it
    level: standard
    host_slug: laptop--home--alice
    want_host_slug: laptop--<PATH>
  - id: project_name_slug_account_only_collapses
    why: the single-dash project slug of the same session carries the same bare account name and collapses the same way, so no separator form returns it
    level: standard
    project_name: -home-alice
    want_project_name: -<PATH>
  - id: metadata_path_account_only_collapses
    why: the path form of that session is the home folder itself; it collapses to the placeholder like a home path outside the project does, instead of keeping the account name as if it were a project folder
    level: standard
    cwd: /home/alice
    project_file_path: /home/alice
    want_cwd: /<PATH>
    want_project_file_path: /<PATH>
  - id: windows_metadata_path_account_only_collapses
    why: a session recorded on Windows and run from the home folder collapses the same way and keeps its volume letter, so the Windows form is not the one that returns the account name
    level: standard
    cwd: 'C:\Users\alice'
    project_file_path: 'C:\Users\alice'
    want_cwd: 'C:\<PATH>'
    want_project_file_path: 'C:\<PATH>'
