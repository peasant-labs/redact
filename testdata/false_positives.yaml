    rule: jwt_token
    expect: match
    reason: 'Ported from detect-secrets/tests/plugins/jwt_test.py FP. detect-secrets rejects via is_formally_valid (base64+JSON validator we do not replicate); we accept structural JWT shape since the FP cost is one over-redaction and the FN cost is leaking real auth credentials.'
