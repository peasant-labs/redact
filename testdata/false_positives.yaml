  # NOTE: Two of the four detect-secrets JWT negative cases (jwt_test.py FP_10 and
  # FP_11) are intentionally flipped from expect: no_match to expect: match.
  # detect-secrets rejects these via is_formally_valid (base64-decode each segment
  # + JSON-parse). We do not replicate that validator in Go — the FP cost in
  # transcripts is one extra redaction, while the FN cost (leaking a real JWT) is
  # high. Documented deviation: we accept structural JWT shape for long-segment cases
  # (FP_10, FP_11), detect-secrets adds formal validity.
