      is "-----BEGIN PGP PRIVATE KEY BLOCK-----" (not "BEGIN PGP PRIVATE KEY").
      v2.1.1 adds a dedicated arm for this form: before v2.1.1, "PGP " was inside
      the optional-prefix group which generated the incorrect "BEGIN PGP PRIVATE KEY"
      header without BLOCK, silently missing real PGP keys in transcripts.
    source: detect_secrets

