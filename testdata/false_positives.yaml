  # FP_12 (eyJAAAA.eyJBBB) and FP_13 (eyJBB.eyJCC.eyJDDDD) remain as no_match
  # (aligned with detect-secrets) because the v2.1.1 jwt_token pattern adds a {10,}
  # minimum on head/payload bodies. Tiny synthetic segments (≤4 chars after eyJ)
  # do not encode valid JSON objects — the floor {"a":1} encodes to 10 chars.

