  # ---------------------------------------------------------------------------
  # v2.1.1 FP boundary cases for new v2.1.0 rules
  # Covers the three rules added in v2.1.0 and documents the jwt_token {10,}
  # floor.
  # ---------------------------------------------------------------------------

  - name: fp_slack_webhook_url_incomplete_missing_bot_and_token
    input: "https://hooks.slack.com/services/T12345"
    rule: slack_webhook_url
    expect: no_match
    reason: >
      Incomplete Slack webhook URL: real Slack incoming webhooks require all three
      path segments — /services/{workspace_id}/{bot_user_id}/{token}. This URL
      has only the workspace_id segment (T12345) and is missing the required /B{...}/{...}
      suffix. The pattern requires T[a-zA-Z0-9_]+/B[a-zA-Z0-9_]+/[a-zA-Z0-9_]+ so
      a single segment alone does not match.
    source: pattern_analysis

  - name: fp_basic_auth_uri_no_credentials
    input: "http://localhost:5000/<%= @variable %>"
    rule: basic_auth_uri
    expect: no_match
    reason: >
      URL without embedded credentials (no user:pass@ form) does not match the
      basic_auth_uri rule. The pattern requires ://user:pass@host where both user
      and pass must be non-empty and separated by colon before the @ sign. A bare
      localhost URL with no credentials is not URI-form basic auth.
    source: pattern_analysis

  - name: fp_twilio_auth_token_too_short
    input: "SK"
    rule: twilio_auth_token
    expect: no_match
    reason: >
      The SK prefix alone (without 32 lowercase hex characters after it) does not
      match the twilio_auth_token rule. The pattern requires SK[a-z0-9]{32} so the
      body must be exactly 32 characters. A bare "SK" prefix with no body fails
      the length requirement.
    source: pattern_analysis
