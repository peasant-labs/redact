  - name: fp_jwt_token_incomplete
    input: "encoded header: eyJhbGciOiJIUzI1NiJ9 (truncated)"
    rule: jwt_token
    expect: no_match
    reason: >
      A JWT header without the payload segment (second eyJ...) does not match; the pattern requires
      at least two dot-separated eyJ segments.
    source: pattern_analysis

  - name: fp_jwt_token_base64_only
    input: "data: eyJhbGciOiJub25lIn0"
