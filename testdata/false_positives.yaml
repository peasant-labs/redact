  - name: fp_jwt_tiny_segments
    input: "eyJa.eyJb"
    rule: jwt_token
    expect: no_match
    reason: >
      Tiny 2-segment JWT shape with single-character bodies after eyJ. The v2.1.1
      pattern adds a {10,} minimum on both head and payload character classes:
      eyJ[a-zA-Z0-9_-]{10,}.eyJ[a-zA-Z0-9_-]{10,}. The shortest real JSON object
      {"a":1} encodes to 10 base64url chars so a {10,} floor keeps all real unsigned
      JWTs while rejecting documentation-example shapes like "eyJa.eyJb".
    source: pattern_analysis

