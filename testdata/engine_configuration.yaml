engines: [go-regexp, go-re2]
required_names: [stdlib_identity, re2_identity, unknown_identity, empty_identity]
cases:
  - {name: stdlib_identity, value: go-regexp, want: go-regexp}
  - {name: re2_identity, value: go-re2, want: go-re2}
  - {name: unknown_identity, value: re2, error: true}
  - {name: empty_identity, value: '', error: true}
residue_only_pattern: 'residue-only-construction-probe'
routing:
  patterns:
    - id: configured_route
      category: secrets
      pattern: '(configured-)(secret-value)'
      replacement: '${1}<HIDDEN>'
  xdg_data_home: /data/alice/share
  required_names: [configured_backreference, xdg_literal, xdg_backreference]
  cases:
    - name: configured_backreference
      rule: configured_route
      input: configured-secret-value
      output: configured-<HIDDEN>
      expect_replacement: true
    - name: xdg_literal
      rule: xdg_data_home
      input: /data/alice/config
      output: /data/<USER>/config
      expect_replacement: false
    - name: xdg_backreference
      rule: xdg_data_home
      input: /data/alice/config
      output: /data/<USER>/config
      # Generated replacements are normally literal. Inject a backreference
      # into this test instance to exercise the engine rewrite branch using
      # the real generated pattern. Its absent group expands to empty, so the
      # expected output stays identical to the unmodified XDG replacement.
      replacement_override: '${1}/data/<USER>'
      expect_replacement: true
# RedactJSON under an object key. probe_rule names a built-in rule whose
# compiled entry the test reads: scans is how often the injected engine scanned
# with it, and last_scan the text of the last scan.
json_key_routing:
  required_names: [value_under_secret_key, format_value_under_secret_key, ordinary_value_under_secret_key, web_key_private_member]
  cases:
    - name: value_under_secret_key
      # One scan of the value with every active rule, through the injected
      # engine, asks whether a format rule matches all of it. None does, so the
      # value is replaced whole and no text pass follows.
      json: '{"db_password": "canaryJsonPw0rd!2026"}'
      want: '{"db_password": "<SECRET>"}'
      probe_rule: github_pat
      scans: 1
      last_scan: 'canaryJsonPw0rd!2026'
    - name: format_value_under_secret_key
      # The same scan finds that github_pat matches the whole value, so the
      # value goes to the text pass: a second scan.
      json: '{"token": "ghp_abcdefghijklmnopqrstuvwxyz0123456789"}'
      want: '{"token": "<GITHUB_PAT>"}'
      probe_rule: github_pat
      scans: 2
      last_scan: 'ghp_abcdefghijklmnopqrstuvwxyz0123456789'
    - name: ordinary_value_under_secret_key
      # The value test, which needs no engine, rejects the value. Only the
      # text pass scans it.
      json: '{"password": "string"}'
      want: '{"password": "string"}'
      probe_rule: github_pat
      scans: 1
      last_scan: 'string'
    - name: web_key_private_member
      # A private member is decided by the member name and the shape of the
      # value alone. The key-type member is the only string the engine scans.
      json: '{"kty": "oct", "k": "canarySymmetricKey0123456789abcd"}'
      want: '{"kty": "oct", "k": "<JWK_PRIVATE_KEY>"}'
      probe_rule: jwk_private_member
      scans: 1
      last_scan: 'oct'
